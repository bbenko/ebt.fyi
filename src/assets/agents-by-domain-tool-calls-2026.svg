<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">In what domains are agents deployed? Percent of tool calls</title>
  <desc id="desc">A monospace chart showing software engineering at 49.7 percent, followed by back-office automation at 9.1 percent, other at 7.1 percent, and smaller shares across marketing, sales, finance, analytics, research, cybersecurity, customer service, media, document work, education, e-commerce, healthcare, legal, and travel.</desc>
  <rect width="1200" height="720" fill="#ffffff" />
  <text x="14" y="40" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#444" xml:space="preserve">In what domains are agents deployed? (% of tool calls)</text>
  <text x="14" y="88" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Software engineering           |============================================================== 49.7%</text>
  <text x="14" y="126" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Back-office automation         |========== 9.1%</text>
  <text x="14" y="164" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Other                          |======= 7.1%</text>
  <text x="14" y="202" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Marketing and copywriting      |==== 4.4%</text>
  <text x="14" y="240" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Sales and CRM                  |==== 4.3%</text>
  <text x="14" y="278" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Finance and accounting         |==== 4.0%</text>
  <text x="14" y="316" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Data analysis and BI           |=== 3.5%</text>
  <text x="14" y="354" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Academic research              |=== 2.8%</text>
  <text x="14" y="392" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Cybersecurity                  |== 2.4%</text>
  <text x="14" y="430" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Customer service               |== 2.2%</text>
  <text x="14" y="468" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Gaming and interactive media   |== 2.1%</text>
  <text x="14" y="506" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Document and presentation      |== 1.9%</text>
  <text x="14" y="544" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Education and tutoring         |== 1.8%</text>
  <text x="14" y="582" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">E-commerce operations          |= 1.3%</text>
  <text x="14" y="620" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Medicine and healthcare        |= 1.0%</text>
  <text x="14" y="658" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Legal                          |= 0.9%</text>
  <text x="14" y="696" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#555" xml:space="preserve">Travel and logistics           |= 0.8%</text>
</svg>
