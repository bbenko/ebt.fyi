<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1012" viewBox="0 0 2048 1012" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Analysis Intelligence versus Cost to Run, May 22 2026</title>
  <desc id="desc">Scatter plot of frontier AI models comparing Artificial Analysis Intelligence Index on the vertical axis and Cost to Run Intelligence Index on the horizontal axis. The most attractive quadrant is shaded in green in the upper left.</desc>
