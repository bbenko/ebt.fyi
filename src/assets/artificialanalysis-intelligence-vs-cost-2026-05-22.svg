    .ui { font: 28px Arial, Helvetica, sans-serif; fill: #111; }
    .legend { font: 27px Arial, Helvetica, sans-serif; fill: #111; }
    .axis { font: 27px Arial, Helvetica, sans-serif; fill: #333; font-weight: 700; }
    .tick { font: 20px Arial, Helvetica, sans-serif; fill: #4a4a4a; }
    .label { font: 24px Arial, Helvetica, sans-serif; fill: #666; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    .brand { font: 32px Georgia, "Times New Roman", serif; fill: #555; font-weight: 700; }
  </style>

